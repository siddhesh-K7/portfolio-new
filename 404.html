<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Siddhesh K</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .not-found-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="not-found-container">
        <div class="glass-card" style="max-width: 500px; padding: 40px 30px;">
            <div class="error-code">404</div>
            <h1 style="font-size: 1.8rem; margin-bottom: 12px;">Page Not Found</h1>
            <p style="color: var(--muted); margin-bottom: 30px; line-height: 1.6;">
                The page you're searching for might have been moved, renamed, or is currently undergoing engineering updates.
            </p>
            <a href="index.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-arrow-left"></i> Return to Portfolio
            </a>
        </div>
    </div>
</body>
</html>
